<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiệm Hoa Khô / 乾燥花店</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#f7f3f0;
}

header{
    background:#d9a7b0;
    color:white;
    text-align:center;
    padding:18px;
    font-size:20px;
    font-weight:bold;
}

.sub{font-size:13px;}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

h3{font-size:15px;margin:8px 0 2px;}

.cn{font-size:13px;color:#666;}

.price{
    color:#d94f70;
    font-weight:bold;
    margin:5px 0;
}

button{
    background:#d94f70;
    color:white;
    border:none;
    padding:8px 12px;
    margin:10px;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:15px;
    font-size:12px;
    color:gray;
}
</style>
</head>

<body>

<header>
🌸 Tiệm Hoa Khô 🌸<br>
<span class="sub">乾燥花專賣店</span>
</header>

<div class="container">

<!-- 1 -->
<div class="card">
<img src="02.jpg.JPG">
<h3>Bó hoa hồng đỏ tươi</h3>
<div class="cn">紅玫瑰花束</div>
<div class="price">300元</div>
<button>Đặt hàng / 下單</button>
</div>

<!-- 2 -->
<div class="card">
<img src="03.jpg.JP">
<h3>Bó hoa hồng khô vintage</h3>
<div class="cn">復古乾燥玫瑰花束</div>
<div class="price">500元</div>
<button>Đặt hàng / 下單</button>
</div>

<!-- 3 -->
<div class="card">
<img src=01.jpg.JPG>
<h3>Bó hoa baby trắng</h3>

<div class="price">450元</div>
<button>Đặt hàng / 下單</button>
</div>

<div class="cn">復古乾燥花束</div>
<div class="price">200.000元</div>

</div>

<!-- 6 -->
<div class="card">
<img src="06.jpg.JPG">
