<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Hoa Khô</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8a7b5; /* Màu nền hồng tổng thể */
            margin: 0;
            padding: 0;
        }

        /* Dải nền màu kem sáng ở đầu trang */
        .header-container {
            background-color: #f7eedf;
            padding: 15px 20px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Khối đăng nhập nằm ở góc trên bên phải */
        .login-box {
            align-self: flex-end;
            text-align: right;
            margin-bottom: 10px;
        }

        .login-box input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 160px;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        .login-box button {
            background-color: #e8557f; /* Màu hồng đậm của nút bấm */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 160px;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background-color: #d03e66;
        }

        /* Tiêu đề tiệm hoa chính giữa */
        .main-title {
            color: #555;
            margin: 10px 0;
            font-size: 24px;
            font-weight: bold;
        }

        /* Khu vực trưng bày danh mục hoa */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* Khung bao bọc từng sản phẩm hoa */
        .flower-item {
            background-color: #f7eedf;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding-bottom: 15px;
        }

        .flower-img-placeholder {
            width: 100%;
            height: 180px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-style: italic;
        }

        .flower-info {
            padding: 10px;
        }

        .flower-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
        }

        .flower-price {
            font-size: 16px;
            color: #e8557f;
            font-weight: bold;
            margin: 5px 0;
        }

        .order-btn {
            background-color: #e8557f;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ĐẦU TRANG -->
    <div class="header-container">
        <!-- Khối Đăng Nhập -->
        <div class="login-box">
            <input type="tel" id="phoneInput" placeholder="輸入手機號碼" maxlength="11"><br>
            <button id="loginBtn">登入會員</button>
        </div>
        
        <!-- Tiêu đề -->
        <div class="main-title">Tiệm Hoa Khô</div>
    </div>

    <!-- DANH SÁCH SẢN PHẨM -->
    <div class="gallery">
        
        <!-- Sản phẩm 1 -->
        <div class="flower-item">
            <div class="flower-img-placeholder">[Hình ảnh Bó hoa baby trắng]</div>
            <div class="flower-info">
                <div class="flower-title">Bó hoa baby trắng<br><small style="color:#888;">滿天星花束</small></div>
                <div class="flower-price">450元</div>
                <button class="order-btn" onclick="orderProduct('Bó hoa baby trắng')">Đặt hàng / 下單</button>
            </div>
        </div>

        <!-- Sản phẩm 2 -->
        <div class="flower-item">
            <div class="flower-img-placeholder">[Hình ảnh Bó hoa khô cổ điển]</div>
            <div class="flower-info">
                <div class="flower-title">Bó hoa khô cổ điển<br><small style="color:#888;">復古乾燥花束</small></div>
                <div class="flower-price">200元</div>
                <button class="order-btn" onclick="orderProduct('Bó hoa khô cổ điển')">Đặt hàng / 下單</button>
            </div>
        </div>

    </div>

    <!-- ĐOẠN XỬ LÝ ĐĂNG NHẬP VÀ ĐẶT HÀNG -->
    <script>
        const phoneInput = document.getElementById('phoneInput');
        const loginBtn = document.getElementById('loginBtn');

        // Hàm kiểm tra xử lý khi bấm nút "登入會員"
        loginBtn.addEventListener('click', function() {
            const phoneValue = phoneInput.value.trim();

            if (phoneValue === "") {
                // Nếu chưa nhập số điện thoại, hiện thông báo nhắc nhở bằng cả 2 tiếng
                alert("請輸入手機號碼！\n(Vui lòng nhập số điện thoại!)");
            } else {
                // Nếu đã nhập, cho phép đăng nhập thành công
                alert("登入成功！ Số điện thoại của bạn: " + phoneValue);
            }
        });

        // Hàm xử lý nhanh khi bấm nút Đặt hàng
        function orderProduct(name) {
            alert("Bạn đã chọn đặt mua: " + name + ". Hệ thống đang xử lý đơn hàng!");
        }
    </script>

</body>
</html>
