<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Hoa Khô</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8a7b5; /* Màu nền hồng gốc */
            margin: 0;
            padding: 0;
        }
        /* Căn chỉnh khoảng cách cho phần logo ở trên cùng */
        .header-logo {
            padding: 30px 0 20px 0;
        }
        .logo {
            max-width: 140px;
            height: auto;
            border-radius: 12px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 0 12px 20px 12px;
        }
        /* Khung màu trắng bo góc chia 2 cột */
        .flower-item {
            background-color: white;
            border-radius: 20px;
            padding: 0 0 15px 0;
            width: 46%; /* Chia 2 cột hoàn hảo */
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 5px;
        }
        .flower-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .flower-name {
            font-size: 14px;
            font-weight: bold;
            color: #000;
            margin: 12px 5px 3px 5px;
        }
        .flower-subname {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
        }
        .flower-price {
            font-size: 16px;
            color: #e9527b;
            font-weight: bold;
            margin-bottom: 12px;
        }
        /* Nút đặt hàng màu hồng đậm */
        .btn-order {
            background-color: #e9527b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. CHỈ GIỮ LẠI LOGO Ở TRÊN CÙNG -->
    <div class="header-logo">
        <img src="Logo.jpg.PNG" alt="Logo" class="logo">
    </div>

    <!-- 2. DANH SÁCH CÁC BÓ HOA BÊN DƯỚI (ĐÃ BỎ HOÀN TOÀN CHỮ TIÊU ĐỀ) -->
    <div class="gallery">

        <!-- Bó hoa 1 -->
        <div class="flower-item">
            <img src="01.jpg.JPG" alt="Hoa 1">
            <div class="flower-name">Bó hoa hồng đỏ tươi</div>
            <div class="flower-subname">紅玫瑰花束</div>
            <div class="flower-price">300元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>

        <!-- Bó hoa 2 -->
        <div class="flower-item">
            <img src="02.jpg.JPG" alt="Hoa 2">
            <div class="flower-name">Bó hoa baby trắng</div>
            <div class="flower-subname">滿天星花束</div>
            <div class="flower-price">450元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>

        <!-- Bó hoa 3 -->
        <div class="flower-item">
            <img src="03.jpg.JPG" alt="Hoa 3">
            <div class="flower-name">Bó hoa lavender tím</div>
            <div class="flower-subname">薰衣草花束</div>
            <div class="flower-price">350元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>

        <!-- Bó hoa 4 -->
        <div class="flower-item">
            <img src="04.jpg.JPG" alt="Hoa 4">
            <div class="flower-name">Bó hoa khô cổ điển</div>
            <div class="flower-subname">復古乾燥花束</div>
            <div class="flower-price">200.000元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>

    </div>

</body>
</html>
