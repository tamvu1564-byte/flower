<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Hoa Khô</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8a7b5; /* Màu nền hồng gốc bên dưới */
            margin: 0;
            padding: 0;
        }
        /* Tạo một dải nền màu kem sáng ở trên cùng để nuốt trọn khung logo */
        .header-logo {
            background-color: #f7eedf; /* Màu kem trùng khớp màu nền ảnh logo */
            padding: 10px 0;
            width: 100%;
        }
        .logo {
            width: 90%; 
            max-width: 450px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 25px 12px;
        }
        .flower-item {
            background-color: white;
            border-radius: 20px;
            padding: 0 0 15px 0;
            width: 46%; 
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 5px;
        }
        .flower-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .flower-name {
            font-size: 14px;
            font-weight: bold;
            color: #000;
            margin: 12px 5px 3px 5px;
        }
        .flower-subname {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
        }
        .flower-price {
            font-size: 16px;
            color: #e9527b;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-order {
            background-color: #e9527b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Logo chìm vào nền kem phía trên -->
    <div class="header-logo">
        <img src="Logo.jpg.PNG" alt="Logo" class="logo">
    </div>

    <!-- Danh sách đầy đủ 7 bó hoa -->
    <div class="gallery">
        <div class="flower-item">
            <img src="01.jpg.JPG" alt="Hoa 1">
            <div class="flower-name">Bó hoa hồng đỏ tươi</div>
            <div class="flower-subname">紅玫瑰花束</div>
            <div class="flower-price">300元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="02.jpg.JPG" alt="Hoa 2">
            <div class="flower-name">Bó hoa baby trắng</div>
            <div class="flower-subname">滿天星花束</div>
            <div class="flower-price">450元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="03.jpg.JPG" alt="Hoa 3">
            <div class="flower-name">Bó hoa lavender tím</div>
            <div class="flower-subname">薰衣草花束</div>
            <div class="flower-price">350元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="04.jpg.JPG" alt="Hoa 4">
            <div class="flower-name">Bó hoa khô cổ điển</div>
            <div class="flower-subname">復古乾燥花束</div>
            <div class="flower-price">200.000元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="05.jpg.JPG" alt="Hoa 5">
            <div class="flower-name">Bó hoa hướng dương</div>
            <div class="flower-subname">向日葵花束</div>
            <div class="flower-price">280元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="06.jpg.JPG" alt="Hoa 6">
            <div class="flower-name">Bó hoa cẩm tú cầu</div>
            <div class="flower-subname">繡球花束</div>
            <div class="flower-price">400元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
        <div class="flower-item">
            <img src="07.jpg.JPG" alt="Hoa 7">
            <div class="flower-name">Bó hoa tulip mộng mơ</div>
            <div class="flower-subname">鬱金香花束</div>
            <div class="flower-price">320元</div>
            <button class="btn-order">Đặt hàng / 下單</button>
        </div>
    </div>

</body>
</html>
