<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web Hoa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
        }
        .header-logo {
            margin-top: 20px;
        }
        .logo {
            max-width: 200px;
            height: auto;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .gallery img {
            width: 250px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Logo ở trên cùng -->
    <div class="header-logo">
        <img src="Logo.jpg.PNG" alt="Logo Trang Web" class="logo">
    </div>

    <h1>Bộ Sưu Tập Ảnh Hoa</h1>

    <!-- Danh sách ảnh bên dưới -->
    <div class="gallery">
        <img src="01.jpg.JPG" alt="Ảnh 1">
        <img src="02.jpg.JPG" alt="Ảnh 2">
        <img src="03.jpg.JPG" alt="Ảnh 3">
        <img src="04.jpg.JPG" alt="Ảnh 4">
        <img src="05.jpg.JPG" alt="Ảnh 5">
        <img src="06.jpg.JPG" alt="Ảnh 6">
        <img src="07.jpg.JPG" alt="Ảnh 7">
    </div>

</body>
</html>
