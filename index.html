<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Hoa Khô</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8a7b5; /* Màu nền hồng tổng thể */
            margin: 0;
            padding: 0;
        }

        /* Thanh đầu trang màu kem chứa tên tiệm và nút đăng nhập */
        .header-logo {
            background-color: #f7eedf;
            padding: 15px 30px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between; /* Đẩy chữ sang trái, đăng nhập sang phải */
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #555;
            margin: 0;
        }

        /* Khối đăng nhập góc trên bên phải */
        .login-box {
            text-align: right;
        }

        .login-box input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 160px;
            margin-bottom: 4px;
            box-sizing: border-box;
        }

        .login-box button {
            background-color: #e8557f; /* Màu hồng của nút bấm */
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 160px;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background-color: #d03e66;
        }

        /* KHU VỰC HIỂN THỊ DANH SÁCH HOA THEO HÀNG NGANG */
        .gallery {
            display: flex;
            flex-direction: row; /* Xếp theo hàng ngang */
            flex-wrap: wrap;     /* Tự động xuống hàng nếu màn hình nhỏ */
            justify-content: center; /* Căn giữa màn hình */
            gap: 25px;           /* Khoảng cách giữa các hộp hoa */
            padding: 40px 20px;
        }

        /* Khung hoa bo góc giống mẫu gốc của bạn */
        .flower-item {
            background-color: #f7eedf;
            border-radius: 15px;
            width: 300px; /* Định kích thước cố định vừa vặn khi nằm ngang */
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hình ảnh hoa gốc của bạn */
        .flower-item img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* Tránh làm méo ảnh hoa */
        }

        .flower-info {
            padding: 12px 10px 5px 10px;
        }

        .flower-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
            line-height: 1.4;
        }

        .flower-price {
            font-size: 16px;
            color: #e8557f;
            font-weight: bold;
            margin: 8px 0;
        }

        .order-btn {
            background-color: #e8557f;
            color: white;
            border: none;
            padding: 6px 25px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .order-btn:hover {
            background-color: #d03e66;
        }
    </style>
</head>
<body>

    <!-- PHẦN ĐẦU TRANG -->
    <div class="header-logo">
        <div class="logo">乾燥花專賣店</div>
        
        <!-- Khối Đăng Nhập Hoạt Động Được -->
        <div class="login-box">
            <input type="tel" id="phoneInput" placeholder="輸入手機號碼" maxlength="11"><br>
            <button id="loginBtn">登入會員</button>
        </div>
    </div>

    <!-- DANH SÁCH SẢN PHẨM HÀNG NGANG -->
    <div class="gallery">
        
        <!-- Bó hoa số 1 -->
        <div class="flower-item">
            <img src="01.jpg.JPG" alt="Bó hoa baby trắng">
            <div class="flower-info">
                <div class="flower-title">Bó hoa baby trắng<br><small style="color:#888; font-weight: normal;">滿天星花束</small></div>
                <div class="flower-price">450元</div>
                <button class="order-btn" onclick="orderProduct('Bó hoa baby trắng')">Đặt hàng / 下單</button>
            </div>
        </div>

        <!-- Bó hoa số 2 -->
        <div class="flower-item">
            <img src="02.jpg.JPG" alt="Bó hoa khô cổ điển">
            <div class="flower-info">
                <div class="flower-title">Bó hoa khô cổ điển<br><small style="color:#888; font-weight: normal;">復古乾燥花束</small></div>
                <div class="flower-price">200元</div>
                <button class="order-btn" onclick="orderProduct('Bó hoa khô cổ điển')">Đặt hàng / 下單</button>
            </div>
        </div>

    </div>

    <!-- KÍCH HOẠT HÀNH ĐỘNG CHO NÚT BẤM -->
    <script>
        const phoneInput = document.getElementById('phoneInput');
        const loginBtn = document.getElementById('loginBtn');

        // Lập trình xử lý đăng nhập
        loginBtn.addEventListener('click', function() {
            const phoneValue = phoneInput.value.trim();
            if (phoneValue === "") {
                alert("請輸入手機號碼！\n(Vui lòng nhập số điện thoại!)");
            } else {
                alert("登入成功！\nSố hệ thống nhận: " + phoneValue);
            }
        });

        // Lập trình xử lý đặt hàng
        function orderProduct(name) {
            alert("Bạn đã chọn đặt mua: " + name + ".\nHệ thống đang xử lý đơn hàng!");
        }
    </script>

</body>
</html>
